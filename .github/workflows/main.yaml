name: CI
on:
  workflow_dispatch:
  push:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        version: [v2, v3]

    steps:

    - uses: actions/checkout@v7
    - name: Ensure host ~/.gitconfig is a file
      run: touch "$HOME/.gitconfig"
    - uses: "opensafely-core/setup-action@v1"
      with:
          install-just: true
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: false

    - name: check
      run: just check ${{ matrix.version }}

    - name: Write Ubuntu Pro token
      run: |
        mkdir -p .secrets
        printf '%s' '${{ secrets.UBUNTU_PRO_TOKEN }}' > .secrets/ubuntu_pro_token

    - name: build
      run: just build ${{ matrix.version }}

    - name: Run tests
      run: just test ${{ matrix.version }}

    - name: Build rstudio
      run: just build-rstudio ${{ matrix.version }}

    - name: Test rstudio
      run: |
        just _env  # ideally needs creating before we run the tests
        just test-rstudio ${{ matrix.version }}

    - name: Log into GitHub Container Registry
      if: github.ref == 'refs/heads/main'
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login https://ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Publish images
      if: github.ref == 'refs/heads/main'
      run: |
        just publish ${{ matrix.version }}
        just publish-rstudio ${{ matrix.version }}
